<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Bag | {name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <h1>YOUR BAG</h1>
    <div class="box" id="bag-list"></div>

    <div id="inquiry-form" class="box" style="margin-top: 2em; display: none;">
      <h2>INQUIRE ABOUT THESE ITEMS</h2>
      <p>Fill out your details and we'll get in touch to finalize your purchase. Give us your email, phone number, or both &mdash; whatever's easiest for you.</p>

      <form id="inquiry-form-element">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <button type="submit" class="btn-inquire">SEND INQUIRY</button>
        <p id="form-status"></p>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/products.js"></script>
  <script src="js/bag.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/inquiry.js"></script>
</body>
</html>
